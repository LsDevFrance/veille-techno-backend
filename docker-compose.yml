services:
  db:
    image: postgres:18
    container_name: kanban-postgres
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: liron
      POSTGRES_PASSWORD: kanban
      POSTGRES_DB: api-kanban
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liron -d api-kanban"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: kanban-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/api-kanban
      SPRING_DATASOURCE_USERNAME: liron
      SPRING_DATASOURCE_PASSWORD: kanban

volumes:
  postgres_data:
